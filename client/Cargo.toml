[package]
name = "matchbook-client"
description = "Command-line client and market-making bot for the MatchBook order book on Solana"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "matchbook"
path = "src/bin/matchbook.rs"

[[bin]]
name = "matchbook-mm"
path = "src/bin/matchbook-mm.rs"

[dependencies]
matchbook-sdk = { path = "../sdk" }
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
ctrlc = "3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
solana-commitment-config = "3"
solana-compute-budget-interface = "3"
solana-keypair = "3.1.2"
solana-message = "4"
solana-pubkey = "3"
solana-rpc-client = "4.3"
solana-rpc-client-api = "4.3"
solana-signature = "3"
solana-signer = "3"
solana-system-interface = { version = "3", features = ["bincode"] }
solana-transaction = "4"
solana-transaction-status-client-types = "4.3"
spl-associated-token-account-interface = "2"
spl-token-interface = "3"

[lints]
workspace = true
