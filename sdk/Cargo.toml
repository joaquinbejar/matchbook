[package]
name = "matchbook-sdk"
description = "Rust client for the MatchBook order book on Solana: instructions, market snapshots, exact quotes and a Jupiter adapter"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Implements jupiter_amm_interface::Amm for MatchBook markets.
jupiter = ["dep:jupiter-amm-interface", "dep:anyhow", "dep:rust_decimal"]

[dependencies]
matchbook-engine = { workspace = true }
matchbook-program = { path = "../program", version = "1.0.0", features = ["no-entrypoint", "client"] }
solana-pubkey = { version = "3.0.0", features = ["curve25519"] }
solana-instruction = "~3.5.0"
bytemuck = { workspace = true }
jupiter-amm-interface = { version = "=1.0.0-beta.0", optional = true }
anyhow = { version = "1", optional = true }
rust_decimal = { version = "1.36", optional = true }

[dev-dependencies]
litesvm = "0.18"
litesvm-token = "0.18"
solana-clock = "~3.2.0"
solana-keypair = "3.1.2"
solana-signer = "3.0.1"
solana-message = "4.2.4"
solana-transaction = "4.1.5"
solana-account = "4.3.0"
# The Account type jupiter-amm-interface uses.
jup-account = { package = "solana-account", version = "3.4.0" }

[lints]
workspace = true

[[test]]
name = "jupiter"
required-features = ["jupiter"]
